<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тестовая форма — Дозор</title><style>body{margin:0;background:#f1f4ed;color:#233629;font:15px 'Segoe UI',sans-serif}main{max-width:530px;margin:45px auto;padding:32px;background:white;border:1px solid #dce5d5;border-radius:16px}h1{font-size:30px;line-height:1.2;margin:20px 0}p{color:#75816c;line-height:1.6;font-size:13px}label{display:block;font-size:12px;margin:22px 0;color:#627b55}input{box-sizing:border-box;display:block;width:100%;padding:13px;margin-top:8px;border:1px solid #d8e0cf;border-radius:7px;color:#36502c;background:#fbfcfa}button{padding:14px 20px;background:#2d5135;color:white;border:0;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}#status{background:#eef5e6;padding:18px;border-radius:8px;font-size:14px;line-height:1.6;margin-top:20px}#status.error{background:#fff0e6;color:#a45b30}[hidden]{display:none}small{letter-spacing:1px;color:#829172;font-size:10px}</style></head><body><main><small>ДОЗОР / СОБСТВЕННЫЙ ТЕСТОВЫЙ СТЕНД</small><h1>Оставьте<br>тестовую заявку.</h1><p>Только вымышленные данные. Эта форма проверяет соединение с локальной тестовой CRM; реальные письма не отправляются.</p><form id="form"><label>Имя<input name="name" required value="Тест Дозора"></label><label>Email<input name="email" type="email" required value="monitor@example.invalid"></label><label>Метка проверки<input name="marker" required></label><button>Отправить тестовую заявку</button></form><div id="status" role="status" hidden></div><p>Надпись «Спасибо» подтверждает ответ формы. Доставка отдельно проверяется по записи в CRM.</p></main><script>
let token;const marker='guardian-manual-'+Date.now();document.querySelector('[name=marker]').value=marker;
const ready=fetch('/api/state').then(r=>r.json()).then(d=>token=d.token);
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const out=document.querySelector('#status');out.hidden=false;out.className='';out.textContent='Отправляю…';try{await ready;const r=await fetch('/api/demo/submit',{method:'POST',headers:{'Content-Type':'application/json','x-guardian-token':token},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.detail);out.textContent=d.message}catch(e){out.className='error';out.textContent='Ошибка: '+e.message}finally{button.disabled=false}};
</script></body></html>
