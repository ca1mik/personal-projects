# Replace the paths and certificate files before enabling this config.
# Recommended public root: the repository's site/ directory only.
#
# VERIFY BEFORE DEPLOYING: this config redirects everything to ppdstr.online,
# but as of 2026-06-08 DNS for ppdstr.online still points to 95.163.244.138
# (400 Bad Request - not this project), while ppdstr.ru already resolves to
# 31.31.197.13 and serves the live site (200 OK). Re-run
# tools/check_public_domains.ps1 and either point ppdstr.online's DNS at the
# new VPS, or swap server_name/redirect target below to make ppdstr.ru
# canonical instead - otherwise visitors get redirected to a domain that
# does not serve this site.

server {
    listen 80;
    listen [::]:80;
    server_name ppdstr.online www.ppdstr.online ppdstr.ru www.ppdstr.ru;

    return 301 https://ppdstr.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ppdstr.online ppdstr.ru www.ppdstr.ru;

    # Use a certificate that covers every alias in this redirect block.
    ssl_certificate     /etc/letsencrypt/live/ppdstr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppdstr.online/privkey.pem;

    return 301 https://ppdstr.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ppdstr.online;

    root /var/www/ppdstr/site;
    index client.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ppdstr.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppdstr.online/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        try_files /client.html =404;
    }

    location = /works {
        try_files /works.html =404;
    }

    location = /offer {
        try_files /offer.html =404;
    }

    location = /payment {
        try_files /payment.html =404;
    }

    location = /privacy {
        try_files /privacy.html =404;
    }

    location = /client.html      { try_files $uri =404; }
    location = /works.html       { try_files $uri =404; }
    location = /offer.html       { try_files $uri =404; }
    location = /payment.html     { try_files $uri =404; }
    location = /privacy.html     { try_files $uri =404; }
    location = /styles.css       { try_files $uri =404; }
    location = /client-theme.css { try_files $uri =404; }
    location = /client.js        { try_files $uri =404; }
    location = /favicon.svg      { try_files $uri =404; }
    location = /robots.txt       { try_files $uri =404; }
    location = /sitemap.xml      { try_files $uri =404; }
    location = /site.webmanifest { try_files $uri =404; }

    # Portfolio/consumables JSON and gallery media (images, process video)
    location /data/   { try_files $uri =404; }
    location /images/ { try_files $uri =404; }

    location = /index.html {
        return 404;
    }

    location = /dashboard.html {
        return 404;
    }

    location = /vk-kit.html {
        return 404;
    }

    location = /dashboard.js {
        return 404;
    }

    location = /app.js {
        return 404;
    }

    location /scripts/ {
        return 404;
    }

    # Bot backend (aiohttp, runs locally on the same server) -
    # booking form submissions and Robokassa payment callbacks.
    # Keeps the public site and the bot API on one origin, so the
    # frontend's default same-origin request to /api/booking-request
    # works without any data-request-api-url override.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /robokassa/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri =404;
    }
}
