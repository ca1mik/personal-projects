<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в Stock Monitor</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <p class="eyebrow">MVP</p>
      <h1 class="title">Вход в мониторинг акций</h1>
      <p class="subtitle">
        Простая cookie-session авторизация для локального запуска. После входа откроется dashboard с live-обновлением через SSE.
      </p>

      <form action="/login" method="post" class="form-grid">
        <label>
          Логин
          <input class="input" name="username" type="text" required autocomplete="username">
        </label>
        <label>
          Пароль
          <input class="input" name="password" type="password" required autocomplete="current-password">
        </label>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <button class="button button-primary" type="submit">Войти</button>
      </form>

      <p class="hint">По умолчанию: {{ default_login }} / {{ default_password }}</p>
    </section>
  </main>
</body>
</html>
